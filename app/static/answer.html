<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QVA · Respostas" />
    <title>QVA — Respostas</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="answer-only">
    <header>
      <h1>Respostas</h1>
      <div class="status">
        <span class="chip"><span class="dot" data-service="link"></span> <span id="link-text">a ligar…</span></span>
      </div>
    </header>

    <main>
      <p id="idle" class="banner" data-state="idle">
        À espera da próxima questão…
      </p>

      <section class="card" id="question-card" hidden>
        <div class="card-head">
          <h2>Questão <span id="question-type" class="tag"></span></h2>
        </div>
        <p id="question-text"></p>
        <ul id="question-options"></ul>
      </section>

      <section class="card answer" id="answer-card" hidden>
        <div class="card-head">
          <h2>Resposta</h2>
          <span id="confidence" class="confidence"></span>
        </div>
        <p id="answer-line" class="answer-line"></p>
        <div id="ambiguous" class="warn" hidden>⚠️ Resposta ambígua — ver explicação.</div>
        <h3>Explicação</h3>
        <p id="explanation"></p>
        <p id="meta" class="timing"></p>
      </section>

      <section class="card error" id="error-card" hidden>
        <h2>Não foi possível resolver</h2>
        <p id="error-text"></p>
      </section>
    </main>

    <script src="/answer.js"></script>
  </body>
</html>
