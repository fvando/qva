<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Question Vision Assistant</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Question Vision Assistant</h1>
      <div id="status" class="status">
        <span class="chip"><span class="dot" data-service="camera"></span> Câmera</span>
        <span class="chip"><span class="dot" data-service="llm"></span> LLM</span>
        <span class="chip"><span class="dot" data-service="server"></span> Servidor</span>
      </div>
    </header>

    <main>
      <section class="card" id="preview-card">
        <div class="card-head">
          <h2>Preview</h2>
          <label class="switch">
            <input type="checkbox" id="live" /> ao vivo
          </label>
        </div>
        <img id="preview-img" alt="preview da câmera" />
        <video id="browser-video" playsinline autoplay muted hidden></video>
        <div class="camera-picker">
          <select id="camera-kind">
            <option value="browser">Câmera deste dispositivo</option>
            <option value="usb">Câmera do servidor (USB / interna)</option>
            <option value="rtsp">Câmera Wi-Fi (RTSP)</option>
            <option value="http">Câmera Wi-Fi (HTTP/MJPEG)</option>
          </select>
          <select id="camera-usb" hidden></select>
          <input id="camera-url" type="text" placeholder="rtsp://utilizador:pass@ip:554/stream" hidden />
          <button id="camera-apply" type="button">Usar</button>
        </div>
        <button id="browser-switch" class="ghost" type="button" hidden>Alternar câmera (frente/trás)</button>
        <p id="camera-msg" class="camera-msg"></p>
      </section>

      <p id="state-banner" class="banner" data-state="idle">Pronto para capturar.</p>

      <button id="capture" class="primary">Capturar nova questão</button>

      <section class="card" id="question-card" hidden>
        <div class="card-head">
          <h2>Questão <span id="question-type" class="tag"></span></h2>
        </div>
        <p id="question-text"></p>
        <ul id="question-options"></ul>
      </section>

      <section class="card answer" id="answer-card" hidden>
        <div class="card-head">
          <h2>Resposta sugerida</h2>
          <span id="confidence" class="confidence"></span>
        </div>
        <p id="answer-line" class="answer-line"></p>
        <div id="ambiguous" class="warn" hidden>⚠️ Resposta ambígua — ver explicação.</div>
        <h3>Explicação</h3>
        <p id="explanation"></p>
        <p id="timing" class="timing"></p>
      </section>

      <section class="card error" id="error-card" hidden>
        <h2>Erro</h2>
        <p id="error-text"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
